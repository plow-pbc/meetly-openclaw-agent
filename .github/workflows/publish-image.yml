name: Publish image

# Builds and pushes Meetly's image to GHCR with the repository's own
# GITHUB_TOKEN. Publishing is automatic; promoting a digest to Plow's
# one-click deploy stays a manual step for the owner (see the run summary).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_latest:
        description: Promote this image to latest
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: meetly-openclaw-agent
  # Admitted slug, confirmed with `plow-agents image show meetly`.
  PLOW_SLUG: meetly

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.promote_latest }}

      # The published base image is linux/amd64 only, and so is Plow.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="ghcr.io/${OWNER,,}/${PACKAGE_NAME}"
          ref="${image}@${DIGEST}"
          {
            echo "## Published image"
            echo
            echo '```'
            echo "${ref}"
            echo '```'
            echo
            echo "Tags:"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "## Promote to Plow (manual)"
            echo
            echo '```sh'
            echo "plow-agents image promote ${PLOW_SLUG} ${ref}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
