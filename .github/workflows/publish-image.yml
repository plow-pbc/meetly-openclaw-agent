name: Publish image

# Builds and pushes Meetly's image to GHCR with the repository's own
# GITHUB_TOKEN. Publishing is automatic; promoting a digest to Plow's
# one-click deploy stays a manual step for the owner (see the run summary).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: meetly-openclaw-agent
  # Admitted slug, confirmed with `plow-agents image show meetly`.
  PLOW_SLUG: meetly

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # The published base image is linux/amd64 only, and so is Plow.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check out pinned replay tooling
        if: github.ref == 'refs/heads/preview/meetly-v4'
        uses: actions/checkout@v4
        with:
          ref: 442936c45e1b82dd48215dd35ab00084bcec81ba
          path: .preview-replay
          sparse-checkout: evals/replay

      - name: Capture the published image on native amd64
        if: github.ref == 'refs/heads/preview/meetly-v4'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('.preview-replay/evals/replay/capture.mjs')
          s = p.read_text().replace('http://host.docker.internal:', 'http://127.0.0.1:')
          s = s.replace('"--add-host", "host.docker.internal:host-gateway",', '"--network", "host",')
          s = s.replace('"run", "-d", "--name", name', '"create", "--name", name')
          s = s.replace('    "-v", `${state}:/var/lib/plow`, opt.image], { stdio: "ignore" });',
            '    opt.image], { stdio: "ignore" });\n  execFileSync("docker", ["cp", `${state}/meetly`, `${name}:/var/lib/plow/meetly`]);\n  execFileSync("docker", ["start", name], { stdio: "ignore" });')
          p.write_text(s)
          PYTHON
          node .preview-replay/evals/replay/capture.mjs --image "$IMAGE" --out preview-capture --keep

      - name: Save preview capture and runtime logs
        if: always() && github.ref == 'refs/heads/preview/meetly-v4'
        run: |
          mkdir -p preview-capture
          for container in $(docker ps -aq --filter name=meetly-replay-capture); do
            docker logs "$container" > "preview-capture/runtime-$container.log" 2>&1
            docker rm -f "$container"
          done

      - name: Upload preview smoke evidence
        if: always() && github.ref == 'refs/heads/preview/meetly-v4'
        uses: actions/upload-artifact@v4
        with:
          name: preview-capture
          path: preview-capture

      - name: Summary
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="ghcr.io/${OWNER,,}/${PACKAGE_NAME}"
          ref="${image}@${DIGEST}"
          {
            echo "## Published image"
            echo
            echo '```'
            echo "${ref}"
            echo '```'
            echo
            echo "Tags:"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "## Promote to Plow (manual)"
            echo
            echo '```sh'
            echo "plow-agents image promote ${PLOW_SLUG} ${ref}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
